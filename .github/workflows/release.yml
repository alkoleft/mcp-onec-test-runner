name: Release & Publish

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-jar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build application
        run: ./gradlew bootJar --no-daemon

      - name: Publish to GitHub Packages
        run: ./gradlew publish --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag version
        id: tag_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "VERSION=${TAG}" >> $GITHUB_OUTPUT
          echo "VERSION_NUMBER=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-yaxunit-runner-jar
          path: ./build/libs/mcp-yaxunit-runner-${{ steps.tag_version.outputs.VERSION_NUMBER }}.jar

  build-native:
    needs: build-jar
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            binary_suffix: ""
          - os: macos-latest
            platform: macos-aarch64
            binary_suffix: ""
          - os: windows-latest
            platform: windows-x86_64
            binary_suffix: ".exe"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew (Unix)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build native image (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew nativeCompile --no-daemon

      - name: Build native image (Windows)
        if: runner.os == 'Windows'
        run: ./gradlew nativeCompile --no-daemon
        env:
          GRADLE_OPTS: -Djava.io.tmpdir=D:/tmp

      - name: Extract tag version
        id: tag_version
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "VERSION=${TAG}" >> $GITHUB_OUTPUT
          echo "VERSION_NUMBER=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-yaxunit-runner-${{ matrix.platform }}
          path: ./build/native/nativeCompile/mcp-yaxunit-runner${{ matrix.binary_suffix }}

  release:
    needs: [build-jar, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract tag version
        id: tag_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "VERSION=${TAG}" >> $GITHUB_OUTPUT
          echo "VERSION_NUMBER=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: mcp-yaxunit-runner-jar
          path: artifacts/

      - name: Download Linux native artifact
        uses: actions/download-artifact@v4
        with:
          name: mcp-yaxunit-runner-linux-x86_64
          path: artifacts/linux/

      - name: Download macOS native artifact
        uses: actions/download-artifact@v4
        with:
          name: mcp-yaxunit-runner-macos-aarch64
          path: artifacts/macos/

      - name: Download Windows native artifact
        uses: actions/download-artifact@v4
        with:
          name: mcp-yaxunit-runner-windows-x86_64
          path: artifacts/windows/

      - name: Rename native artifacts
        run: |
          mv artifacts/linux/mcp-yaxunit-runner artifacts/mcp-yaxunit-runner-linux-x86_64
          mv artifacts/macos/mcp-yaxunit-runner artifacts/mcp-yaxunit-runner-macos-aarch64
          mv artifacts/windows/mcp-yaxunit-runner.exe artifacts/mcp-yaxunit-runner-windows-x86_64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag_version.outputs.VERSION }}
          name: Release ${{ steps.tag_version.outputs.VERSION }}
          body: |
            ## MCP YaXUnit Runner ${{ steps.tag_version.outputs.VERSION }}

            ### Changes
            - Automatic release from tag ${{ steps.tag_version.outputs.VERSION }}

            ### Downloads
            - `mcp-yaxunit-runner-*.jar` — универсальный JAR (требует JRE 17+)
            - `mcp-yaxunit-runner-linux-x86_64` — native binary для Linux
            - `mcp-yaxunit-runner-macos-aarch64` — native binary для macOS Apple Silicon
            - `mcp-yaxunit-runner-windows-x86_64.exe` — native binary для Windows
          draft: true
          prerelease: false
          files: |
            artifacts/mcp-yaxunit-runner-${{ steps.tag_version.outputs.VERSION_NUMBER }}.jar
            artifacts/mcp-yaxunit-runner-linux-x86_64
            artifacts/mcp-yaxunit-runner-macos-aarch64
            artifacts/mcp-yaxunit-runner-windows-x86_64.exe

  docker-build:
    runs-on: ubuntu-latest
    needs: build-jar
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        dockerfile: ['Dockerfile.sse', 'Dockerfile.stdio']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: mcp-yaxunit-runner-jar

      - name: Extract tag version
        id: tag_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "VERSION=${TAG}" >> $GITHUB_OUTPUT
          echo "VERSION_NUMBER=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            suffix=-${{ matrix.dockerfile == 'Dockerfile.sse' && 'sse' || 'stdio' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: APP_VERSION=${{ steps.tag_version.outputs.VERSION_NUMBER }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
